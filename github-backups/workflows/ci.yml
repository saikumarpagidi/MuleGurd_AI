name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Python Services — pytest + coverage
  # Runs for every Python microservice in parallel
  # ─────────────────────────────────────────────────────────────
  test-python:
    name: "Test ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - transaction-ingest
          - ai-engine
          - graph-service
          - feature-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Java Scoring Orchestrator — mvn test
  # ─────────────────────────────────────────────────────────────
  test-java:
    name: "Test scoring-orchestrator (Java)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run Maven tests
        working-directory: services/scoring-orchestrator
        run: mvn test -B -q

      - name: Upload Surefire test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-report
          path: services/scoring-orchestrator/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Credential scanning — detect-secrets
  # Blocks any commit that contains hardcoded secrets
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: "Credential Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run secrets baseline scan
        run: |
          detect-secrets scan \
            --exclude-files '\.env\.example$' \
            --exclude-files '\.gitignore$' \
            --exclude-files 'package-lock\.json$' \
            > /tmp/secrets-report.json
          # Fail if any secrets are detected
          python -c "
          import json, sys
          with open('/tmp/secrets-report.json') as f:
              report = json.load(f)
          results = report.get('results', {})
          if results:
              print('BLOCKED: Potential secrets detected in the following files:')
              for filepath, findings in results.items():
                  for finding in findings:
                      print(f'  {filepath}:{finding[\"line_number\"]} [{finding[\"type\"]}]')
              sys.exit(1)
          print('No secrets detected.')
          "

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Lint Python — ruff
  # Fast static analysis
  # ─────────────────────────────────────────────────────────────
  lint-python:
    name: "Lint Python"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: |
          ruff check services/*/app/ --output-format=github
