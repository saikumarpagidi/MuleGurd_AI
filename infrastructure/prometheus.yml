global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Load alert rules
rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # ── Python Microservices ───────────────────────────────
  - job_name: 'transaction-ingest'
    static_configs:
      - targets: ['transaction-ingest:8001']
    metrics_path: '/metrics'

  - job_name: 'ai-engine'
    static_configs:
      - targets: ['ai-engine:8002']
    metrics_path: '/metrics'

  - job_name: 'graph-service'
    static_configs:
      - targets: ['graph-service:8003']
    metrics_path: '/metrics'

  - job_name: 'feature-service'
    static_configs:
      - targets: ['feature-service:8004']
    metrics_path: '/metrics'

  # ── Spring Boot Orchestrator ──────────────────────────
  # Spring Boot Actuator exposes /actuator/prometheus
  - job_name: 'scoring-orchestrator'
    static_configs:
      - targets: ['scoring-orchestrator:8080']
    metrics_path: '/actuator/prometheus'

  # ── Flink Metrics ─────────────────────────────────────
  - job_name: 'flink'
    static_configs:
      - targets: ['flink-jobmanager:8081']
    metrics_path: '/metrics'

  # ── Prometheus self-monitoring ─────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Kafka JMX Exporter ────────────────────────────────
  # Uncomment after adding kafka-exporter container
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka-exporter:9308']
