# ============================================================
# MuleGuard.AI — Docker Compose
# Infrastructure (10 containers) + Microservices (5 containers)
#
# Start:  docker-compose up -d
# Stop:   docker-compose down
# Reset:  docker-compose down -v   ← DELETES ALL DATA
# ============================================================

services:

  # ─────────────────────────────────────────────────
  # MESSAGING — Kafka + Zookeeper
  # ─────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: mg_zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep Zookeeper"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: mg_kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.producer.async.DefaultEventHandler=WARN,state.change.logger=WARN"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mg_kafka_ui
    hostname: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: muleguard-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks: [muleguard]
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  # DATABASES
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mg_postgres
    hostname: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: muleguard
      POSTGRES_USER: muleguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muleguard_local_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muleguard -d muleguard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mg_redis
    hostname: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --loglevel warning
    volumes:
      - redis-data:/data
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  neo4j:
    image: neo4j:5.13-community
    container_name: mg_neo4j
    hostname: neo4j
    ports:
      - "7474:7474" # HTTP port for the web browser UI
      - "7687:7687" # Bolt port for backend API code to connect 
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-muleguard_neo4j}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./infrastructure/neo4j:/var/lib/neo4j/import
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────────
  # STREAM PROCESSING — Apache Flink
  # ─────────────────────────────────────────────────
  flink-jobmanager:
    image: flink:1.18-java17
    container_name: mg_flink_jobmanager
    hostname: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1g
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
        state.backend.incremental: true
        heartbeat.interval: 1000
        heartbeat.timeout: 5000
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/config"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  flink-taskmanager:
    image: flink:1.18-java17
    container_name: mg_flink_taskmanager
    hostname: flink-taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1g
    networks: [muleguard]
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  # MONITORING — Grafana + Prometheus
  # ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: mg_prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [muleguard]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: mg_grafana
    hostname: grafana
    depends_on: [prometheus]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin_local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [muleguard]
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  # MICROSERVICES — Python services
  # ─────────────────────────────────────────────────
  transaction-ingest:
    build:
      context: ./services/transaction-ingest
      dockerfile: Dockerfile
    container_name: mg_transaction_ingest
    hostname: transaction-ingest
    ports:
      - "8001:8001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muleguard_local_dev}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICE_NAME: transaction-ingest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-engine:
    build:
      context: .
      dockerfile: ./services/ai-engine/Dockerfile
    container_name: mg_ai_engine
    hostname: ai-engine
    ports:
      - "8002:8002"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muleguard_local_dev}
      SERVICE_NAME: ai-engine
      AI_ENGINE_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/ai-engine/app:/app/app:ro
      - ./ml/models:/app/ml/models:ro
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  graph-service:
    build:
      context: ./services/graph-service
      dockerfile: Dockerfile
    container_name: mg_graph_service
    hostname: graph-service
    ports:
      - "8003:8003"
    environment:
      # Prefix matches Settings(env_prefix="GRAPH_SERVICE_") in config.py
      GRAPH_SERVICE_NEO4J_URI: bolt://neo4j:7687
      GRAPH_SERVICE_NEO4J_USER: neo4j
      GRAPH_SERVICE_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-muleguard_neo4j}
      GRAPH_SERVICE_TGN_MODEL_PATH: ml/models/tgn/tgn_v1_best.pt
      SERVICE_NAME: graph-service
    volumes:
      # Mount the app code for local dev
      - ./services/graph-service/app:/app/app:ro
      # Mount the trained model checkpoint and tgn_model.py into the container
      - ./ml/models:/app/ml/models:ro
     
    depends_on:
      neo4j:
        condition: service_healthy
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  feature-service:
    build:
      context: ./services/feature-service
      dockerfile: Dockerfile
    container_name: mg_feature_service
    hostname: feature-service
    ports:
      - "8004:8004"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_NAME: feature-service
    depends_on:
      redis:
        condition: service_healthy
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────────
  # SCORING ORCHESTRATOR — Spring Boot WebFlux (Java)
  # ─────────────────────────────────────────────────
  scoring-orchestrator:
    build:
      context: ./services/scoring-orchestrator
      dockerfile: Dockerfile
    container_name: mg_scoring_orchestrator
    hostname: scoring-orchestrator
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AI_ENGINE_URL: http://ai-engine:8002
      GRAPH_SERVICE_URL: http://graph-service:8003
      FEATURE_SERVICE_URL: http://feature-service:8004
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/muleguard
      AI_ENGINE_TIMEOUT_MS: "10000"
      GRAPH_SERVICE_TIMEOUT_MS: "15000"
      FEATURE_SERVICE_TIMEOUT_MS: "5000"
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muleguard_local_dev}
      WEIGHT_TGN: "0.50"
      WEIGHT_LGBM: "0.30"
      WEIGHT_AUTOENCODER: "0.15"
      WEIGHT_DEVICE: "0.05"
      RISK_THRESHOLD_REVIEW: "0.45"
      RISK_THRESHOLD_BLOCK: "0.75"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [muleguard]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

# ─────────────────────────────────────────────────
# VOLUMES — Named volumes for data persistence
# ─────────────────────────────────────────────────
volumes:
  postgres-data:
    name: muleguard_postgres_data
  redis-data:
    name: muleguard_redis_data
  neo4j-data:
    name: muleguard_neo4j_data
  neo4j-logs:
    name: muleguard_neo4j_logs
  kafka-data:
    name: muleguard_kafka_data
  zookeeper-data:
    name: muleguard_zookeeper_data
  zookeeper-log:
    name: muleguard_zookeeper_log
  flink-checkpoints:
    name: muleguard_flink_checkpoints
  grafana-data:
    name: muleguard_grafana_data
  prometheus-data:
    name: muleguard_prometheus_data

# ─────────────────────────────────────────────────
# NETWORKS — Single bridge network for all services
# ─────────────────────────────────────────────────
networks:
  muleguard:
    name: muleguard_network
    driver: bridge
